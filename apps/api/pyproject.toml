[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencefirst-api"
version = "0.1.0"
description = "Evidence-First MVP-0 API service."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.30,<0.35",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.1,<4",
    "redis>=5.0,<6",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "structlog>=24.1,<25",
    "httpx>=0.27,<0.28",
    "python-multipart>=0.0.9,<0.1",
    "evidencefirst-shared"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*"]